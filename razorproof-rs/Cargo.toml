[workspace]
members = [
  "crates/razorproof-core",
  "crates/razorproof-policy",
  "crates/razorproof-store",
  "crates/razorproof-provider",
  "crates/razorproof-engine",
  "crates/razorproof-server",
  "crates/razorproof-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Achyuth Jayadevan <achyuth@jayadevan.in>"]
repository = "https://github.com/Achxy/RazorLean"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["http2", "json", "macros"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
http = "1.3"
mime = "0.3"
mime_guess = "2.0"
percent-encoding = "2.3"
rand = "0.9"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls", "http2", "charset"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time", "net", "fs"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "limit", "request-id", "trace", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
